services:
  factionwars:
    image: ghcr.io/thequib/factions:latest
    container_name: factions
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./factions.db:/app/factions.db
      - ./sprites:/app/sprites
    environment:
      - AUTH_PASSWORD=super-secret-password
      # Disaster event interval in game-seconds (default: 300 = every 5 minutes)
      # - DISASTER_INTERVAL=300
    restart: unless-stopped