<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Faction Wars — Live</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#0a0a0a;display:flex;justify-content:center;align-items:center;
     min-height:100vh;font-family:'Courier New',monospace;overflow:hidden;}
canvas{image-rendering:pixelated;box-shadow:0 0 40px rgba(0,0,0,0.9);}
#status{position:fixed;top:8px;left:50%;transform:translateX(-50%);
        color:#444;font:9px monospace;pointer-events:none;}
#controls{position:fixed;bottom:14px;right:16px;display:flex;gap:8px;z-index:100;}
.ctrl-btn{
  background:rgba(10,10,10,.92);color:#999;
  border:1px solid #555;
  font:bold 11px 'Courier New',monospace;
  padding:7px 16px;cursor:pointer;letter-spacing:2px;
  transition:color .15s,border-color .15s,background .15s;
  text-shadow:0 0 6px rgba(255,255,255,.15);
}
.ctrl-btn:hover{color:#eee;border-color:#aaa;background:rgba(30,30,30,.95);}
.ctrl-btn.armed{color:#FF4444;border-color:#FF6644;background:rgba(40,8,8,.95);animation:arm-pulse .5s infinite alternate;}
@keyframes arm-pulse{from{opacity:.7}to{opacity:1}}
#update-banner{display:none;position:fixed;top:0;left:0;right:0;z-index:9999;
  background:rgba(20,20,20,.96);border-bottom:1px solid #555;
  color:#ccc;font:12px monospace;padding:7px 16px;
  display:none;align-items:center;gap:12px;}
#update-banner span{flex:1;}
#update-banner button{background:rgba(255,255,255,.1);border:1px solid #777;
  color:#eee;font:11px monospace;padding:3px 10px;cursor:pointer;border-radius:2px;}
#update-banner button:hover{background:rgba(255,255,255,.2);}
</style>
</head>
<body>
<div id="update-banner"><span>⟳ A new version is available.</span><button onclick="location.reload()">Refresh</button></div>
<canvas id="c"></canvas>
<div id="status">connecting…</div>
<div id="controls">
  <button class="ctrl-btn" id="btnReset">⟳ RESET</button>
</div>
<script>
'use strict';

// ── Version polling ───────────────────────────────────────────────────────────
(async()=>{
  try{
    const initial=await fetch('/api/version').then(r=>r.text());
    setInterval(async()=>{
      try{
        const current=await fetch('/api/version').then(r=>r.text());
        if(current!==initial)document.getElementById('update-banner').style.display='flex';
      }catch(_){}
    },60000);
  }catch(_){}
})();

// ── Canvas setup ──────────────────────────────────────────────────────────────
const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');
const MAP_W  = 1200, MAP_H = 820, UI = 380;
canvas.width  = MAP_W + UI;
canvas.height = MAP_H;
ctx.imageSmoothingEnabled = false; // keep pixel art sprites crisp when scaled up

function scaleCanvas() {
  const sc = Math.min(window.innerWidth / (MAP_W + UI), window.innerHeight / MAP_H);
  canvas.style.width  = ((MAP_W + UI) * sc) + 'px';
  canvas.style.height = (MAP_H * sc) + 'px';
}
scaleCanvas();
window.addEventListener('resize', scaleCanvas);

// ── Sprite loader ─────────────────────────────────────────────────────────────
// Drop a PNG named after any unit type or building type into /sprites/ and it
// will be used automatically; if missing, the procedural pixel-art is drawn instead.
const SPRITES = {};
const SPRITE_UNIT_SIZE   = 48;  // px on canvas for unit sprites (1.5× native 32px)
const SPRITE_BLDG_SIZE   = 48;
const SPRITE_CASTLE_SIZE = 96;
const SPRITE_TITAN_SIZE  = 96;

const SPRITE_KEYS = [
  // unit types
  'hive_swarm','hive_soldier','hive_host','hive_mite','hive_builder','brood_bug',
  'wiz_fire','wiz_storm','wiz_necro','skeleton','wiz_builder',
  'elf_archer','elf_rogue','elf_builder',
  'pal_knight','pal_cleric','pal_builder',
  'iron_foot','iron_ballista','iron_builder',
  'shade_rogue','phantom','purp_builder',
  'storm_lancer','storm_shaman','cyan_builder',
  'bone_archer','death_knight','bone_builder',
  'frost_mage','ice_golem','ice_builder',
  'myconid','spore_shaman','olive_builder',
  'fire_war','fire_priest','orange_builder',
  'bless_knight','seraph','gold_builder',
  'sea_raider','tide_caller','teal_builder',
  'berserker','blood_shaman','crim_builder',
  'stone_golem','siege_golem','slate_builder',
  'dream_archer','dream_knight','rose_builder',
  // titans
  'elem_fire','elem_water','elem_earth','elem_air','chaos_titan',
  // buildings — prefix with 'bldg_'
  'bldg_castle','bldg_tower',
  'bldg_farm','bldg_library','bldg_stonecircle','bldg_tumor','bldg_brood_nest',
  'bldg_arcane_turret','bldg_elf_forest','bldg_church','bldg_granary','bldg_rampart',
];

function loadSprites() {
  for (const key of SPRITE_KEYS) {
    const img = new Image();
    img.onload = () => { SPRITES[key] = img; };
    img.src = `/sprites/${key}.png`;
    // errors silently ignored — fallback to procedural
  }
}
loadSprites();

// ── WebSocket + state ─────────────────────────────────────────────────────────
let state      = null;   // most recent server state
let terrain    = null;   // persisted between ticks (only sent on full messages)
let clientParticles = []; // locally-generated particles from server events

const WS_URL = `${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}/ws`;
let ws;

function connectWS() {
  document.getElementById('status').textContent = 'connecting…';
  ws = new WebSocket(WS_URL);
  ws.onopen  = () => document.getElementById('status').textContent = '';
  ws.onclose = () => { document.getElementById('status').textContent = 'reconnecting…'; setTimeout(connectWS, 2000); };
  ws.onerror = () => ws.close();
  ws.onmessage = (ev) => {
    const msg = JSON.parse(ev.data);
    if (msg.terrain) terrain = msg.terrain;
    state = msg;
    processEvents(msg.events || []);
  };
}
connectWS();

// ── Client-side particles from server events ──────────────────────────────────
function processEvents(events) {
  for (const ev of events) {
    if (ev.type === 'beam') {
      clientParticles.push({type:'beam', x1:ev.x1,y1:ev.y1,x2:ev.x2,y2:ev.y2,
                            col:ev.color, lw:ev.lw||2, life:0.14});
    } else if (ev.type === 'boom') {
      clientParticles.push({type:'exp', x:ev.x,y:ev.y,r:ev.r,col:ev.color,life:.35,ml:.35});
      sparksLocal(ev.x, ev.y, ev.color, 8);
    } else if (ev.type === 'sparks') {
      sparksLocal(ev.x, ev.y, ev.color, ev.n||6);
    } else if (ev.type === 'death') {
      sparksLocal(ev.x, ev.y, ev.color||'#888', 6);
    } else if (ev.type === 'meteor') {
      clientParticles.push({type:'beam', x1:ev.x,y1:0,x2:ev.x,y2:ev.y,col:'#FF2200',lw:4,life:.14});
    }
  }
}

function sparksLocal(x, y, col, n=6, sp=60) {
  for (let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2, v=sp*.5+Math.random()*sp*.8;
    clientParticles.push({type:'spark',x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,col,life:.4+Math.random()*.3,ml:.7});
  }
}

function addSnow() {
  clientParticles.push({type:'snow',x:Math.random()*MAP_W,y:-5,
    vx:(Math.random()-.5)*30,vy:40+Math.random()*30,col:'#CCDDFF',life:4+Math.random()*3,ml:7});
}

// ── Helpers ───────────────────────────────────────────────────────────────────
const P = 2;

function hpb(cx, cy, w, hp, mhp) {
  const pct = Math.max(0, hp/mhp);
  ctx.fillStyle='rgba(0,0,0,.55)'; ctx.fillRect(cx-w/2,cy,w,3);
  ctx.fillStyle=pct>.55?'#3A9A3A':pct>.28?'#9A9A22':'#CC2222';
  ctx.fillRect(cx-w/2,cy,w*pct,3);
}

// ── All drawing code is unchanged from the original ───────────────────────────
// (Building sprites, castle, unit sprites, map, HUD — identical to factionwar2.html)

function drawCastle(x,y,fid,hp,mhp){
  if(SPRITES['bldg_castle']){
    ctx.save();ctx.translate(x,y);
    ctx.drawImage(SPRITES['bldg_castle'],-SPRITE_CASTLE_SIZE/2,-SPRITE_CASTLE_SIZE/2,SPRITE_CASTLE_SIZE,SPRITE_CASTLE_SIZE);
    hpb(0,SPRITE_CASTLE_SIZE/2+2,SPRITE_CASTLE_SIZE,hp,mhp);
    ctx.restore();return;
  }
  const d=getFaction(fid);ctx.save();ctx.translate(x,y);
  ctx.fillStyle='rgba(0,0,0,.28)';ctx.fillRect(-30,5,64,54);
  ctx.fillStyle=d.lo;ctx.fillRect(-30,-26,13,54);ctx.fillRect(17,-26,13,54);
  ctx.fillStyle=d.color;ctx.fillRect(-28,-24,9,50);ctx.fillRect(19,-24,9,50);
  ctx.fillStyle=d.hi;for(let i=0;i<3;i++){ctx.fillRect(-28+i*4,-32,3,7);ctx.fillRect(19+i*4,-32,3,7);}
  ctx.fillStyle=d.lo;ctx.fillRect(-17,-20,34,50);ctx.fillStyle=d.color;ctx.fillRect(-15,-18,30,46);
  ctx.fillStyle=d.hi;ctx.fillRect(-13,-18,26,8);for(let i=0;i<4;i++)ctx.fillRect(-15+i*8,-27,5,8);
  ctx.fillStyle='#040108';ctx.fillRect(-6,9,12,19);
  ctx.fillStyle=d.hi;ctx.fillRect(-1,-36,2,12);ctx.fillRect(1,-36,9,6);
  hpb(0,29,62,hp,mhp);ctx.restore();
}

function getFaction(fid){
  return (state&&state.factions&&state.factions[fid])||{color:'#888',lo:'#333',hi:'#BBB'};
}

function drawBldg(x,y,btype,fid,hp,mhp){
  if(SPRITES['bldg_'+btype]){
    ctx.save();ctx.translate(x,y);
    ctx.drawImage(SPRITES['bldg_'+btype],-SPRITE_BLDG_SIZE/2,-SPRITE_BLDG_SIZE/2,SPRITE_BLDG_SIZE,SPRITE_BLDG_SIZE);
    if(hp!==undefined&&mhp!==undefined)hpb(0,SPRITE_BLDG_SIZE/2+2,SPRITE_BLDG_SIZE*.8,hp,mhp);
    ctx.restore();return;
  }
  const d=getFaction(fid);
  ctx.save();ctx.translate(x,y);
  if(hp!==undefined&&hp<=0){ctx.restore();return;}
  switch(btype){
    case 'farm':{
      ctx.fillStyle=d.lo;ctx.fillRect(-12,-1,24,16);ctx.fillStyle=d.color;ctx.fillRect(-10,0,20,14);
      ctx.fillStyle='rgba(220,200,80,.5)';ctx.fillRect(-7,2,5,5);ctx.fillRect(3,2,5,5);
      ctx.fillStyle='#040108';ctx.fillRect(-3,8,6,8);
      ctx.fillStyle=d.lo;ctx.fillRect(-13,-9,26,9);ctx.fillRect(-10,-14,20,6);ctx.fillRect(-6,-17,12,4);
      ctx.fillStyle=d.color;ctx.fillRect(-11,-8,22,7);ctx.fillRect(-8,-12,16,5);ctx.fillRect(-4,-15,8,3);break;}
    case 'library':{
      ctx.fillStyle=d.lo;ctx.fillRect(-14,-3,28,20);ctx.fillStyle=d.color;ctx.fillRect(-12,-2,24,18);
      ctx.fillStyle=d.hi;ctx.fillRect(-10,-2,20,6);
      ctx.fillStyle=d.lo;ctx.fillRect(-14,-12,28,10);ctx.fillStyle=d.color;ctx.fillRect(-12,-11,24,9);
      ctx.fillStyle='#CC88FF';for(let i=0;i<3;i++)ctx.fillRect(-8+i*7,-10,4,6);
      ctx.fillStyle=d.hi;ctx.fillRect(-1,-18,4,8);break;}
    case 'stonecircle':{
      ctx.fillStyle=d.lo;for(let i=0;i<8;i++){const a=i*Math.PI/4;ctx.fillRect(Math.cos(a)*13-4,Math.sin(a)*13-7,8,14);}
      ctx.fillStyle=d.color;for(let i=0;i<8;i++){const a=i*Math.PI/4;ctx.fillRect(Math.cos(a)*13-3,Math.sin(a)*13-6,6,12);}
      ctx.fillStyle=d.hi;ctx.fillRect(-3,-3,6,6);break;}
    case 'spore_cluster':{
      ctx.fillStyle='#5A3010';ctx.fillRect(-8,2,5,10);ctx.fillRect(-1,4,4,8);ctx.fillRect(5,1,5,11);
      ctx.fillStyle='#8A3030';ctx.fillRect(-11,-4,11,8);ctx.fillStyle='#AA4040';ctx.fillRect(-10,-3,9,6);
      ctx.fillStyle='#7A2020';ctx.fillRect(3,-6,12,8);ctx.fillStyle='#AA3030';ctx.fillRect(4,-5,10,6);
      ctx.fillStyle='rgba(255,80,80,.8)';ctx.fillRect(-8,-1,2,2);ctx.fillRect(9,-4,2,2);break;}
    case 'tumor':{
      ctx.fillStyle='rgba(80,8,8,.9)';
      for(let i=0;i<5;i++){const a=i*Math.PI*.4;ctx.fillRect(Math.cos(a)*7-7,Math.sin(a)*5-5,14,10);}
      ctx.fillStyle='#5A1010';ctx.fillRect(-6,-6,12,12);ctx.fillStyle='#8A1818';ctx.fillRect(-3,-3,6,6);break;}
    case 'brood_nest':{
      ctx.fillStyle='#1E0808';
      for(let i=0;i<6;i++){const a=i*Math.PI/3;ctx.fillRect(Math.cos(a)*9-7,Math.sin(a)*7-5,14,10);}
      ctx.fillStyle='#3A1010';ctx.fillRect(-10,-10,20,20);ctx.fillStyle='#5A1818';ctx.fillRect(-7,-7,14,14);
      ctx.fillStyle='rgba(200,100,50,.85)';ctx.fillRect(-5,-4,6,8);ctx.fillRect(2,-2,6,7);break;}
    case 'arcane_turret':{
      const t=performance.now()*.003;
      ctx.fillStyle='#1A1A3A';ctx.fillRect(-10,6,20,14);ctx.fillStyle='#2A2A5A';ctx.fillRect(-8,8,16,10);
      ctx.fillStyle='#1A1A3A';ctx.fillRect(-7,-10,14,18);ctx.fillStyle='#2A2A5A';ctx.fillRect(-5,-8,10,14);
      const glow=.4+Math.sin(t)*.25;
      ctx.fillStyle=`rgba(80,120,255,${glow*.3})`;ctx.fillRect(-8,-26,16,14);
      ctx.fillStyle='#4466DD';ctx.fillRect(-4,-24,8,10);ctx.fillStyle=`rgba(140,180,255,${glow})`;ctx.fillRect(-2,-22,4,6);break;}
    case 'elf_forest':{
      const tpos=[[-14,-6],[0,-12],[14,-6],[-8,6],[9,4]];
      for(let i=0;i<5;i++){const[tx,ty]=tpos[i];
        ctx.fillStyle='#4A2E10';ctx.fillRect(tx-2,ty+8,4,10);
        ctx.fillStyle=i%2?'#1A5C28':'#0E3818';
        ctx.fillRect(tx-6,ty+2,12,8);ctx.fillRect(tx-4,ty-3,8,7);ctx.fillRect(tx-2,ty-8,4,6);}
      break;}
    case 'church':{
      const t=performance.now()*.003;
      ctx.fillStyle=`rgba(255,240,100,${.07+Math.sin(t)*.04})`;ctx.fillRect(-22,-22,44,44);
      ctx.fillStyle=d.lo;ctx.fillRect(-12,-5,24,22);ctx.fillStyle=d.color;ctx.fillRect(-10,-4,20,20);
      ctx.fillStyle=d.hi;ctx.fillRect(-8,-4,16,7);
      ctx.fillStyle='#040108';ctx.fillRect(-3,9,6,8);
      ctx.fillStyle=d.lo;ctx.fillRect(-5,-14,10,10);ctx.fillStyle=d.color;ctx.fillRect(-4,-13,8,8);
      ctx.fillStyle=d.hi;ctx.fillRect(-1,-22,3,12);ctx.fillRect(-4,-17,9,3);break;}
    case 'granary':case 'harbor':case 'shrine':case 'mycelium':
    case 'thieves_den':case 'stable':case 'ossuary':case 'frost_shrine':
    case 'forge':case 'blood_altar':case 'foundry':case 'dream_spire':{
      ctx.fillStyle=d.lo;ctx.fillRect(-13,-8,26,22);ctx.fillStyle=d.color;ctx.fillRect(-11,-6,22,18);
      ctx.fillStyle=d.hi;ctx.fillRect(-9,-6,18,6);
      ctx.fillStyle=d.lo;ctx.fillRect(-11,-16,22,9);ctx.fillStyle=d.color;ctx.fillRect(-9,-14,18,8);
      ctx.fillStyle=d.hi;ctx.fillRect(-2,-20,6,7);
      ctx.fillStyle='rgba(255,255,255,.12)';ctx.fillRect(-8,-4,6,5);ctx.fillRect(2,-4,6,5);break;}
    case 'rampart':{
      ctx.fillStyle=d.lo;ctx.fillRect(-20,-8,40,18);ctx.fillStyle=d.color;ctx.fillRect(-18,-6,36,14);
      ctx.fillStyle=d.hi;for(let i=0;i<5;i++)ctx.fillRect(-18+i*9,-12,6,6);break;}
    case 'shadow_trap':case 'storm_totem':case 'death_shrine':case 'ice_wall':
    case 'spore_tower':case 'fire_pit':case 'beacon':case 'tide_shrine':
    case 'rage_totem':case 'veil_shrine':{
      const t=performance.now()*.004;
      const [r,g,b]=hexToRgb(d.color);
      ctx.fillStyle=`rgba(${r},${g},${b},.2)`;ctx.fillRect(-18,-20,36,38);
      ctx.fillStyle=d.lo;ctx.fillRect(-9,-14,18,28);ctx.fillStyle=d.color;ctx.fillRect(-7,-12,14,24);
      ctx.fillStyle=d.hi;ctx.fillRect(-6,-12,12,7);
      const glow=.5+Math.sin(t)*.25;
      const [hr,hg,hb]=hexToRgb(d.hi);
      ctx.fillStyle=`rgba(${hr},${hg},${hb},${glow*.6})`;ctx.fillRect(-3,-18,7,8);break;}
    default:{
      ctx.fillStyle=d.lo;ctx.fillRect(-11,-8,22,20);ctx.fillStyle=d.color;ctx.fillRect(-9,-6,18,16);
      ctx.fillStyle=d.hi;ctx.fillRect(-8,-5,16,5);break;}
  }
  if(hp!==undefined&&mhp!==undefined)hpb(0,18,28,hp,mhp);
  ctx.restore();
}

function hexToRgb(hex){
  const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  return [r,g,b];
}

function drawArrowTower(x,y,fid,hp,mhp){
  if(SPRITES['bldg_tower']){
    ctx.save();ctx.translate(x,y);
    ctx.drawImage(SPRITES['bldg_tower'],-SPRITE_BLDG_SIZE/2,-SPRITE_BLDG_SIZE/2,SPRITE_BLDG_SIZE,SPRITE_BLDG_SIZE);
    hpb(0,SPRITE_BLDG_SIZE/2+2,SPRITE_BLDG_SIZE*.8,hp,mhp);
    ctx.restore();return;
  }
  const neutral=(fid==='neutral');
  const d=getFaction(fid);
  const col=neutral?'#555':d.lo;
  const hi=neutral?'#888':d.hi;
  const accent=neutral?'#777':d.color;
  ctx.save();ctx.translate(x,y);
  ctx.fillStyle='rgba(0,0,0,.3)';ctx.fillRect(-9,4,20,20);
  ctx.fillStyle=col;ctx.fillRect(-9,-3,18,22);ctx.fillStyle=accent;ctx.fillRect(-7,-1,14,18);
  ctx.fillStyle=hi;ctx.fillRect(-6,-1,12,6);
  ctx.fillStyle=col;ctx.fillRect(-9,-10,6,8);ctx.fillRect(-1,-10,6,8);ctx.fillRect(5,-10,5,8);
  ctx.fillStyle=accent;ctx.fillRect(-8,-9,4,6);ctx.fillRect(0,-9,4,6);ctx.fillRect(6,-9,3,6);
  ctx.fillStyle='#060208';ctx.fillRect(-1,3,3,8);
  if(!neutral&&d.color){ctx.fillStyle=accent;ctx.fillRect(7,-15,2,10);ctx.fillRect(9,-15,8,5);}
  hpb(0,23,20,hp,mhp);ctx.restore();
}

// ── Unit draw functions (identical to original) ───────────────────────────────
function drawUnit(e){
  const fid=e.fid, f=e.facing||1, fl=e.flash||0;
  const sa=(e.stealthed&&!e.forest_cover)?.1:(e.forest_cover?.55:1);

  // Check for sprite override
  if(SPRITES[e.utype]){
    ctx.save();ctx.translate(e.x,e.y);if(f<0)ctx.scale(-1,1);
    ctx.globalAlpha=sa;
    ctx.drawImage(SPRITES[e.utype],-SPRITE_UNIT_SIZE/2,-SPRITE_UNIT_SIZE/2,SPRITE_UNIT_SIZE,SPRITE_UNIT_SIZE);
    ctx.globalAlpha=1;
    if(fl>0){ctx.fillStyle=`rgba(255,255,255,${fl*3})`;ctx.fillRect(-SPRITE_UNIT_SIZE/2,-SPRITE_UNIT_SIZE/2,SPRITE_UNIT_SIZE,SPRITE_UNIT_SIZE);}
    ctx.restore();
    if((e.max_hp||0)>=40)hpb(e.x,e.y+SPRITE_UNIT_SIZE/2+3,SPRITE_UNIT_SIZE,e.hp,e.max_hp);
    _drawUnitBadges(e);
    return;
  }

  switch(e.utype){
    case 'hive_swarm':    drawHiveSwarm(e.x,e.y,fid,f,fl);break;
    case 'hive_soldier':  drawHiveSoldier(e.x,e.y,fid,f,fl);break;
    case 'hive_host':     drawHiveHost(e.x,e.y,fid,f,fl);break;
    case 'hive_mite':     drawHiveMite(e.x,e.y,fid);break;
    case 'wiz_fire':case 'wiz_storm':case 'wiz_necro':
      drawWizard(e.x,e.y,fid,e.utype,f,fl);break;
    case 'skeleton':      drawSkeleton(e.x,e.y,f,fl);break;
    case 'elf_archer':    drawElfArcher(e.x,e.y,fid,f,fl,sa);break;
    case 'elf_rogue':     drawElfRogue(e.x,e.y,fid,f,fl,sa);break;
    case 'pal_knight':    drawKnight(e.x,e.y,fid,f,fl);break;
    case 'pal_cleric':    drawCleric(e.x,e.y,fid,f,fl,e.healing||0);break;
    default:
      const role=_utype_role(e.utype);
      drawRoleSprite(e.x,e.y,fid,role,f,fl,sa);
  }
  if((e.max_hp||0)>=40)hpb(e.x,e.y+(e.size||5)+5,(e.size||5)*2+6,e.hp,e.max_hp);
  _drawUnitBadges(e);
}

function _utype_role(utype){
  if(/golem|stone_golem|ice_golem/.test(utype))return 'golem';
  if(/ballista|siege/.test(utype))return 'siege';
  if(/lancer|raider|cavalry/.test(utype))return 'cavalry';
  if(/knight|foot|war|berserker|death_knight|bless_knight|dream_knight/.test(utype))return 'heavy';
  if(/rogue|phantom|shade/.test(utype))return 'rogue';
  if(/mage|shaman|priest|necro|fire|storm|caller|cleric|seraph|archer|builder/.test(utype))return 'ranged';
  return 'light';
}

function _drawUnitBadges(e){
  if(e.dots){ctx.fillStyle='rgba(0,200,0,.7)';ctx.fillRect(e.x-3,e.y-16,2,4);}
  if(e.frost_t>0){ctx.fillStyle='rgba(100,200,255,.7)';ctx.fillRect(e.x,e.y-16,2,4);}

// ── Titan draw functions ──────────────────────────────────────────────────────
function drawTitan(e){
  if(SPRITES[e.ttype]){
    ctx.save();ctx.translate(e.x,e.y);if(e.facing<0)ctx.scale(-1,1);
    ctx.drawImage(SPRITES[e.ttype],-SPRITE_TITAN_SIZE/2,-SPRITE_TITAN_SIZE/2,SPRITE_TITAN_SIZE,SPRITE_TITAN_SIZE);
    ctx.restore();
  } else {
    switch(e.ttype){
      case 'elem_fire':  drawFireTitan(e.x,e.y,e.flash);break;
      case 'elem_water': drawWaterTitan(e.x,e.y,e.flash);break;
      case 'elem_earth': drawEarthTitan(e.x,e.y,e.flash);break;
      case 'elem_air':   drawAirTitan(e.x,e.y,e.flash);break;
      case 'chaos_titan':drawChaosTitan(e.x,e.y,e.flash);break;
    }
  }
  const bw=60,pct=Math.max(0,e.hp/e.max_hp),lpct=Math.max(0,e.life/270);
  ctx.fillStyle='rgba(0,0,0,.65)';ctx.fillRect(e.x-bw/2,e.y-62,bw,3);
  ctx.fillStyle=lpct>.5?'rgba(255,255,255,.6)':`rgba(255,${Math.floor(lpct*2*200)},50,.7)`;
  ctx.fillRect(e.x-bw/2,e.y-62,bw*lpct,3);
  ctx.fillStyle='rgba(0,0,0,.65)';ctx.fillRect(e.x-bw/2,e.y-57,bw,6);
  const fc=(state&&state.factions&&state.factions[e.fid])||{color:'#FF00FF'};
  ctx.fillStyle=fc.color;ctx.fillRect(e.x-bw/2,e.y-57,bw*pct,6);
  ctx.fillStyle='rgba(255,255,255,.5)';ctx.font='7px monospace';ctx.textAlign='center';
  ctx.fillText(e.ttype.replace('elem_','').toUpperCase()+' TITAN',e.x,e.y-64);
  ctx.textAlign='left';
}

  ctx.fillStyle='#FF88FF';ctx.fillRect(-6,-15,4,4);ctx.fillRect(2,-15,4,4);ctx.restore();
}

// ── Map drawing ───────────────────────────────────────────────────────────────
function drawMap(){
  if(!terrain)return;
  const rivers  = _buildRivers(terrain);
  const bridges = _buildBridges(terrain, rivers);
  const forests = terrain.forests||[];
  const factions = (state&&state.factions)||{};

  ctx.fillStyle='#080D06';ctx.fillRect(0,0,MAP_W,MAP_H);
  ctx.fillStyle='rgba(255,255,255,.008)';
  for(let x=0;x<MAP_W;x+=60)ctx.fillRect(x,0,1,MAP_H);
  for(let y=0;y<MAP_H;y+=60)ctx.fillRect(0,y,MAP_W,1);

  // Region control overlay
  if(state&&state.regions){
    // Pass 1: faction colour fill + border for all regions
    for(const reg of state.regions){
      if(reg.controlling_fid){
        const f=factions[reg.controlling_fid];
        if(f){
          const [r,g,b]=hexToRgb(f.color);
          ctx.fillStyle=`rgba(${r},${g},${b},${0.08*reg.control_pct})`;
          ctx.fillRect(reg.x,reg.y,reg.w,reg.h);
          ctx.strokeStyle=`rgba(${r},${g},${b},${0.25*reg.control_pct})`;
        }
      } else {
        ctx.strokeStyle='rgba(255,255,255,0.07)';
      }
      ctx.lineWidth=1;ctx.strokeRect(reg.x,reg.y,reg.w,reg.h);
    }
  }

  // Starting-zone tints
  for(const k in factions){
    const f=factions[k];
    const [r,g,b]=hexToRgb(f.color);
    ctx.fillStyle=`rgba(${r},${g},${b},.04)`;
    ctx.fillRect(f.cx-110,f.cy-110,220,220);
  }
  // Forests
  for(const f of forests){
    ctx.fillStyle='rgba(18,55,14,.55)';ctx.fillRect(f.x-f.r,f.y-f.r,f.r*2,f.r*2);
    for(let i=0;i<8;i++){
      const a=i*Math.PI/4,r=f.r*.6;
      ctx.fillStyle=i%2?'#1A5C28':'#0E3818';
      ctx.fillRect(f.x+Math.cos(a)*r-6,f.y+Math.sin(a)*r-10,12,16);
    }
  }
  // Rivers
  const wt=performance.now()*.0007;
  for(const r of rivers){
    if(r.horiz){
      ctx.fillStyle='#091A28';ctx.fillRect(0,r.pos-r.w/2,MAP_W,r.w);
      ctx.fillStyle=`rgba(14,52,108,${.4+Math.sin(wt)*.1})`;
      for(let x=0;x<MAP_W;x+=22)ctx.fillRect(x+Math.sin(wt+x*.05)*2,r.pos-r.w/2,11,r.w);
      ctx.fillStyle='rgba(30,88,148,.3)';
      ctx.fillRect(0,r.pos-r.w/2,MAP_W,2);ctx.fillRect(0,r.pos+r.w/2-2,MAP_W,2);
    } else {
      ctx.fillStyle='#091A28';ctx.fillRect(r.pos-r.w/2,0,r.w,MAP_H);
      ctx.fillStyle=`rgba(14,52,108,${.4+Math.sin(wt)*.1})`;
      for(let y=0;y<MAP_H;y+=22)ctx.fillRect(r.pos-r.w/2,y+Math.sin(wt+y*.05)*2,r.w,11);
      ctx.fillStyle='rgba(30,88,148,.3)';
      ctx.fillRect(r.pos-r.w/2,0,2,MAP_H);ctx.fillRect(r.pos+r.w/2-2,0,2,MAP_H);
    }
  }
  // Bridges
  for(const b of bridges){
    const r=b.riv;
    ctx.save();
    if(r.horiz){ctx.translate(b.pos,r.pos);}
    else{ctx.translate(r.pos,b.pos);ctx.rotate(Math.PI/2);}
    ctx.fillStyle='#5A3E1A';ctx.fillRect(-27,-16,54,32);
    ctx.fillStyle='#7A5528';for(let p=-25;p<28;p+=9)ctx.fillRect(p,-14,7,28);
    ctx.fillStyle='#9A7038';for(let p=-25;p<28;p+=9)ctx.fillRect(p,-14,2,2);
    ctx.fillStyle='#4A2E10';ctx.fillRect(-27,-14,54,3);ctx.fillRect(-27,11,54,3);
    ctx.restore();
  }
  // Faint roads
  ctx.strokeStyle='rgba(110,82,52,.14)';ctx.lineWidth=3;
  const sk=Object.keys(factions);
  for(let i=0;i<sk.length;i++)for(let j=i+1;j<sk.length;j++){
    const a=factions[sk[i]],b=factions[sk[j]];
    ctx.beginPath();ctx.moveTo(a.cx,a.cy);ctx.lineTo(b.cx,b.cy);ctx.stroke();
  }
  // Region name labels — drawn last so they sit above forests, rivers, and roads
  if(state&&state.regions){
    ctx.font='bold 11px monospace';ctx.textAlign='center';
    for(const reg of state.regions){
      const cx=reg.x+reg.w/2, cy=reg.y+reg.h/2;
      const tw=ctx.measureText(reg.name).width;
      const ph=7, pw=8;
      ctx.fillStyle='rgba(0,0,0,0.45)';
      ctx.beginPath();
      ctx.roundRect(cx-tw/2-pw,cy-ph-1,tw+pw*2,ph*2+2,4);
      ctx.fill();
      if(reg.controlling_fid&&factions[reg.controlling_fid]){
        ctx.fillStyle=factions[reg.controlling_fid].color;
      } else {
        ctx.fillStyle='rgba(255,255,255,0.35)';
      }
      ctx.fillText(reg.name,cx,cy+ph-2);
    }
    ctx.textAlign='left';
  }
}

// Convert serialised terrain back to objects usable by drawing code
let _cachedTerrainRivers=null, _cachedTerrainBridges=null, _cachedTerrainKey='';
function _buildRivers(t){
  const key=JSON.stringify(t.rivers);
  if(key!==_cachedTerrainKey){
    _cachedTerrainKey=key;
    _cachedTerrainRivers=t.rivers||[];
    _cachedTerrainBridges=(t.bridges||[]).map(b=>({riv:_cachedTerrainRivers[b.riv_idx],pos:b.pos}));
  }
  return _cachedTerrainRivers;
}
function _buildBridges(t, rivers){ _buildRivers(t); return _cachedTerrainBridges; }

// ── HUD ───────────────────────────────────────────────────────────────────────
const PANEL_H=114, PANEL_START=70;

function drawHUD(dt){
  if(!state)return;
  const factions=state.factions||{}, factionKeys=state.faction_keys||[];
  const gameTime=state.game_time||0;

  ctx.fillStyle='#0D0D0D';ctx.fillRect(MAP_W,0,UI,MAP_H);
  ctx.fillStyle='#1A1A1A';ctx.fillRect(MAP_W,0,3,MAP_H);
  ctx.fillStyle='rgba(0,0,0,.12)';for(let y=0;y<MAP_H;y+=5)ctx.fillRect(MAP_W,y,UI,2);

  const min=Math.floor(gameTime/60),sec=Math.floor(gameTime%60);
  ctx.fillStyle='#666';ctx.font='bold 11px monospace';
  ctx.fillText(`T I M E   ${min}:${String(sec).padStart(2,'0')}`,MAP_W+18,22);

  // Disaster announce
  if(state.disaster_t>0){
    const alpha=Math.min(1,state.disaster_t/.5);
    ctx.fillStyle=`rgba(0,0,0,${alpha*.7})`;ctx.fillRect(MAP_W+8,28,UI-16,22);
    ctx.fillStyle=state.disaster_col||'#FF8800';ctx.globalAlpha=alpha;ctx.font='bold 11px monospace';
    ctx.fillText(`⚡ ${state.disaster_msg} ⚡`,MAP_W+14,43);ctx.globalAlpha=1;
  }

  const TITAN_TIME=7200;
  const tLeft=Math.max(0,TITAN_TIME-gameTime);
  if(tLeft>0&&tLeft<=300&&!state.titans_spawned){
    ctx.fillStyle=`rgba(180,60,255,${.5+Math.sin(gameTime*4)*.3})`;ctx.font='bold 9px monospace';
    ctx.fillText(`⚡ TITANS IN ${Math.ceil(tLeft)}s ⚡`,MAP_W+18,54);
  } else if(state.titans_spawned){
    ctx.fillStyle='rgba(190,70,255,0.6)';ctx.font='bold 9px monospace';ctx.fillText('⚡ TITANS UNLEASHED ⚡',MAP_W+12,54);}

  const dLeft=Math.max(0,(state.next_disaster_t||0)-gameTime);
  if(dLeft<60){
    ctx.fillStyle=`rgba(255,150,50,${.4+Math.sin(gameTime*5)*.2})`;ctx.font='7px monospace';
    ctx.fillText(`DISASTER IN ${Math.ceil(dLeft)}s`,MAP_W+18,64);}

  // Per-faction stats from entity list
  const hudUnit={},hudBld={};
  const castles={};
  for(const e of state.entities||[]){
    if(e.type==='unit'||e.type==='titan')hudUnit[e.fid]=(hudUnit[e.fid]||0)+1;
    else if(e.type==='building')hudBld[e.fid]=(hudBld[e.fid]||0)+1;
    else if(e.type==='castle')castles[e.fid]=e;
  }

  function factionScore(fid){
    const c=castles[fid];
    if(!c)return -9999;
    return (c.hp/c.max_hp)*1000+(hudUnit[fid]||0)*15+(c.gold||0)*.3;
  }
  const rankedKeys=[...factionKeys].sort((a,b)=>factionScore(b)-factionScore(a));

  ctx.save();ctx.beginPath();ctx.rect(MAP_W,PANEL_START-4,UI,factionKeys.length*PANEL_H+8);ctx.clip();
  for(let pi=0;pi<rankedKeys.length;pi++){
    const k=rankedKeys[pi];
    const targetY=PANEL_START+pi*PANEL_H;
    if(panelAnimY[k]===undefined)panelAnimY[k]=targetY;
    if(gameTime>=30)panelAnimY[k]+=(targetY-panelAnimY[k])*Math.min(1,8*dt);
    else panelAnimY[k]=targetY;
    const y=panelAnimY[k];
    const f=factions[k]||{};
    const castle=castles[k];
    const unitN=hudUnit[k]||0,bldN=hudBld[k]||0;
    ctx.fillStyle='rgba(0,0,0,.52)';ctx.fillRect(MAP_W+10,y-4,UI-20,PANEL_H-4);
    ctx.fillStyle=f.color||'#888';ctx.fillRect(MAP_W+10,y-4,3,PANEL_H-4);
    ctx.save();ctx.globalAlpha=.18;ctx.strokeStyle=f.color||'#888';ctx.lineWidth=1;
    ctx.strokeRect(MAP_W+10,y-4,UI-20,PANEL_H-4);ctx.restore();
    ctx.fillStyle=f.color||'#888';ctx.font='bold 11px monospace';ctx.fillText(f.name||k,MAP_W+20,y+11);
    if(!castle){
      ctx.fillStyle='rgba(200,60,60,.65)';ctx.font='bold 10px monospace';
      ctx.fillText('◆ ELIMINATED',MAP_W+20,y+42);continue;
    }
    const pct=Math.max(0,castle.hp/castle.max_hp);
    ctx.fillStyle='#1A1A1A';ctx.fillRect(MAP_W+18,y+16,UI-38,7);
    ctx.fillStyle=pct>.5?'#3A9A3A':pct>.25?'#9A9A22':'#CC2222';ctx.fillRect(MAP_W+18,y+16,(UI-38)*pct,7);
    ctx.fillStyle='rgba(255,255,255,.55)';ctx.font='9px monospace';
    ctx.fillText(`HP ${Math.ceil(pct*100)}%  ${Math.ceil(castle.hp)}/${castle.max_hp}`,MAP_W+20,y+29);
    ctx.fillStyle='#C8A830';ctx.fillText(`GOLD ${Math.floor(castle.gold||0)}`,MAP_W+20,y+42);
    ctx.fillStyle='rgba(255,255,255,.55)';
    ctx.fillText(`ARMY ${unitN}  BLDG ${bldN}`,MAP_W+20,y+55);
    if(castle.desperation_active){
      ctx.fillStyle=`rgba(255,80,80,${.7+Math.sin(gameTime*6)*.25})`;ctx.font='bold 9px monospace';
      ctx.fillText(`⚔ DESPERATE +30%`,MAP_W+20,y+68);
    } else if(castle.desperation_cooldown>0){
      ctx.fillStyle='rgba(180,180,100,.55)';ctx.font='bold 9px monospace';
      ctx.fillText(`RALLY CD ${Math.ceil(castle.desperation_cooldown)}s`,MAP_W+20,y+68);}
    const rank=rankedKeys.indexOf(k);
    const medals=['🥇','🥈','🥉'];
    const badge=medals[rank]||`#${rank+1}`;
    ctx.font=rank<3?'14px monospace':'bold 9px monospace';
    ctx.fillStyle=rank<3?'rgba(255,255,255,.85)':'rgba(255,255,255,.4)';
    ctx.textAlign='right';ctx.fillText(badge,MAP_W+UI-14,y+16);ctx.textAlign='left';
  }
  ctx.restore();

  // Disaster log
  let logY=PANEL_START+factionKeys.length*PANEL_H+8;
  ctx.fillStyle='rgba(255,255,255,.18)';ctx.font='8px monospace';ctx.fillText('─── DISASTER LOG ───',MAP_W+18,logY);
  logY+=12;
  for(const d of state.disaster_history||[]){
    ctx.fillStyle=d.col||'#fff';ctx.font='8px monospace';
    const t=d.time||0;
    ctx.fillText(`${d.msg} @ ${Math.floor(t/60)}:${String(t%60).padStart(2,'0')}`,MAP_W+18,logY);
    logY+=13;
  }
}

function drawWinScreen(){
  if(!state)return;
  const factions=state.factions||{};
  const wf=factions[state.winner]||{name:'STALEMATE',color:'#fff'};
  const rem=Math.max(0,Math.ceil(state.game_over_timer));
  ctx.fillStyle='rgba(0,0,0,.82)';ctx.fillRect(0,0,MAP_W,MAP_H);
  ctx.fillStyle=wf.color;ctx.shadowColor=wf.color;ctx.shadowBlur=55;
  ctx.font='bold 50px monospace';ctx.textAlign='center';
  ctx.fillText(wf.name,MAP_W/2,MAP_H/2-16);
  ctx.shadowBlur=0;ctx.fillStyle='rgba(255,255,255,.7)';ctx.font='18px monospace';
  ctx.fillText('CONQUERS THE REALM',MAP_W/2,MAP_H/2+20);
  ctx.fillStyle='rgba(255,255,255,.25)';ctx.font='11px monospace';
  ctx.fillText(`new battle in ${rem}s`,MAP_W/2,MAP_H/2+48);
  ctx.textAlign='left';ctx.shadowBlur=0;
}

// ── Particles ─────────────────────────────────────────────────────────────────
function updateParticles(dt){
  if(state&&state.blizzard_t>0&&Math.random()<.5)addSnow();
  for(const p of clientParticles){
    p.life-=dt;
    if(p.type==='spark'||p.type==='snow'){p.x+=p.vx*dt;p.y+=p.vy*dt;if(p.type==='spark')p.vy+=50*dt;}
  }
  clientParticles=clientParticles.filter(p=>p.life>0);
  if(clientParticles.length>500)clientParticles.splice(0,clientParticles.length-500);
}
function drawParticles(){
  for(const p of clientParticles){
    if(p.type==='beam'){
      ctx.strokeStyle=p.col;ctx.lineWidth=p.lw||2;ctx.globalAlpha=Math.max(0,p.life/.14);
      ctx.beginPath();ctx.moveTo(p.x1,p.y1);ctx.lineTo(p.x2,p.y2);ctx.stroke();ctx.globalAlpha=1;
    } else if(p.type==='exp'){
      const a=p.life/p.ml;
      ctx.fillStyle=p.col;ctx.globalAlpha=a*.45;ctx.fillRect(p.x-p.r,p.y-p.r,p.r*2,p.r*2);
      ctx.globalAlpha=a*.65;ctx.strokeStyle=p.col;ctx.lineWidth=3;
      ctx.strokeRect(p.x-p.r*(1+(1-a)*.3),p.y-p.r*(1+(1-a)*.3),p.r*2*(1+(1-a)*.3),p.r*2*(1+(1-a)*.3));
      ctx.globalAlpha=1;
    } else if(p.type==='spark'){
      ctx.fillStyle=p.col;ctx.globalAlpha=p.life/(p.ml||.7)*.9;ctx.fillRect(p.x-2,p.y-2,4,4);ctx.globalAlpha=1;
    } else if(p.type==='snow'){
      ctx.fillStyle='#AACCFF';ctx.globalAlpha=(p.life/(p.ml||7))*.6;ctx.fillRect(p.x-1,p.y-1,3,3);ctx.globalAlpha=1;
    }
  }
}

// ── Vignette ─────────────────────────────────────────────────────────────────
const VIG=ctx.createRadialGradient(MAP_W/2,MAP_H/2,MAP_W*.18,MAP_W/2,MAP_H/2,MAP_W*.75);
VIG.addColorStop(0,'rgba(0,0,0,0)');VIG.addColorStop(1,'rgba(0,0,0,0.55)');

// ── Main render loop (RAF — pure drawing, no simulation) ──────────────────────
let lastTs = performance.now();
const panelAnimY = {}; // animated Y positions for leaderboard panels, keyed by faction id

function loop(ts){
  const dt = Math.min((ts - lastTs) / 1000, 0.08);
  lastTs = ts;
  ctx.imageSmoothingEnabled = false; // re-assert each frame; save/restore can reset it
  updateParticles(dt);

  if(!state){requestAnimationFrame(loop);return;}

  const sx = state.shake_x||0, sy = state.shake_y||0;
  ctx.save();ctx.translate(sx,sy);
  drawMap();

  // Wildfire overlays
  for(const wf of state.wildfire_zones||[]){
    const pct=wf.t/18;const t=performance.now()*.003;
    ctx.fillStyle=`rgba(255,100,0,${(.12+Math.sin(t)*0.05)*pct})`;
    ctx.fillRect(wf.x-wf.r,wf.y-wf.r,wf.r*2,wf.r*2);
  }
  // Plague cloud
  if(state.plague_cloud){
    const pc=state.plague_cloud;
    ctx.fillStyle='rgba(50,200,50,.18)';
    ctx.fillRect(pc.x-pc.r,pc.y-pc.r,pc.r*2,pc.r*2);
    ctx.strokeStyle='rgba(100,255,100,.3)';ctx.lineWidth=2;
    ctx.strokeRect(pc.x-pc.r,pc.y-pc.r,pc.r*2,pc.r*2);
  }
  // Blizzard
  if(state.blizzard_t>0){ctx.fillStyle=`rgba(140,180,255,${.07*(state.blizzard_t/14)})`;ctx.fillRect(0,0,MAP_W,MAP_H);}
  if(state.mania_t>0){const t=performance.now()*.002;ctx.fillStyle=`rgba(255,44,170,${.05+Math.sin(t)*.03})`;ctx.fillRect(0,0,MAP_W,MAP_H);}

  // Entities sorted by draw order
  const sortedE=[...(state.entities||[])].sort((a,b)=>{
    const rank={tower:0,building:1,unit:2,titan:2,castle:3};
    return (rank[a.type]||2)-(rank[b.type]||2);
  });
  for(const e of sortedE){
    if(e.type==='castle')   drawCastle(e.x,e.y,e.fid,e.hp,e.max_hp);
    else if(e.type==='tower')    drawArrowTower(e.x,e.y,e.fid,e.hp,e.max_hp);
    else if(e.type==='building') drawBldg(e.x,e.y,e.btype,e.fid,e.hp,e.max_hp);
    else if(e.type==='unit')     drawUnit(e);
    else if(e.type==='titan')    drawTitan(e);
  }

  drawParticles();
  ctx.fillStyle=VIG;ctx.fillRect(0,0,MAP_W,MAP_H);
  ctx.restore();
  drawHUD(dt);
  if((state.game_over_timer||0)>0)drawWinScreen();

  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

// ── Control buttons ───────────────────────────────────────────────────────────
(function(){
  const btn = document.getElementById('btnReset');
  let armed = false, armTimer = null;

  function disarm() {
    armed = false;
    btn.textContent = '⟳ RESET';
    btn.classList.remove('armed');
  }

  btn.addEventListener('click', () => {
    if (!armed) {
      // First click — arm the button
      armed = true;
      btn.textContent = '⚠ CONFIRM?';
      btn.classList.add('armed');
      armTimer = setTimeout(disarm, 3000);   // auto-disarm after 3 s
    } else {
      // Second click — fire
      clearTimeout(armTimer);
      disarm();
      fetch('/api/reset', { method: 'POST' })
        .catch(e => console.error('reset failed', e));
      // Server pushes updated state via WS; no need to reload
    }
  });
})();
</script>
